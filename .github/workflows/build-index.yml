name: Build content index

on:
  push:
    branches: [ main ]
    paths:
      - 'grammar/**'
      - 'extra/**'
      - 'blog/posts/**'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate index.json files
        run: node scripts/build-index.js

      - name: Commit updated index.json (if changed)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update index.json [skip ci]"
          file_pattern: "grammar/index.json extra/index.json blog/posts/index.json"
